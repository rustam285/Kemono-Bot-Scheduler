name: Supabase keep-alive

# Пингует REST API проекта раз в ~3 дня, чтобы free-проект Supabase
# не уходил в паузу после недели неактивности.
#
# Перед первым запуском добавьте секреты репозитория:
# Settings → Secrets and variables → Actions:
#   SUPABASE_URL         — https://<ref>.supabase.co
#   SUPABASE_SERVICE_KEY — service_role ключ (из .env)
#
# GitHub отключает scheduled-воркфлоу после 60 дней без коммитов —
# при необходимости запускайте вручную (вкладка Actions → Run workflow).

on:
  schedule:
    - cron: "17 6 */3 * *" # каждые ~3 дня в 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/used_urls?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}")
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "Supabase отвечает — проект активен"
            exit 0
          fi
          # 540/40x обычно означают, что проект в паузе: восстановит watchdog
          # бэкенда (SUPABASE_ACCESS_TOKEN) или дашборд
          echo "::warning::Supabase ответил HTTP $code — возможно, проект в паузе"
          exit 1
